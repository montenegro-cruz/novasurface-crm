services:

  mysql:

    image: mysql:8.4

    container_name: novasurface_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: novasurface_crm
      MYSQL_USER: novasurface
      MYSQL_PASSWORD: novasurface

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:

    image: phpmyadmin/phpmyadmin

    container_name: novasurface_phpmyadmin

    restart: unless-stopped

    environment:
      PMA_HOST: mysql

    ports:
      - "8081:80"

    depends_on:
      - mysql

volumes:

  mysql_data: